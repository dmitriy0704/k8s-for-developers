# Конфиг для MongoDB
```yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          environment:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: rootadmin
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: supersecretpassword
            - name: MONGO_INITDB_DATABASE
              value: tasks_db
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb # ⚠️ Важно: имя сервиса станет DNS-именем для Spring Boot
spec:
  ports:
    - port: 27017
  selector:
    app: mongodb
```

# Запуск MongoDB

# Запуск сервера MongoDB

Отлично! Формат .tgz — это просто архив (как .zip), внутри которого находятся уже скомпилированные и готовые к работе файлы MongoDB. Установка заключается в том, чтобы распаковать его и перенести файлы в системную папку.
Вот пошаговый план, как запустить MongoDB из этого архива на вашем Маке:
## Шаг 1. Распакуйте архив и перенесите файлы
Обычно скачанный архив лежит в папке «Загрузки». Откройте Терминал и выполните команды:

   1. Перейдите в папку Загрузки:
   
   cd ~/Downloads
   
   2. Распакуйте архив (замените имя файла на ваше, если версия отличается):
   
   tar -zxvf mongodb-macos-*.tgz
   
   3. Перенесите распакованную папку в более надежное место, например, в ваш домашний каталог под простым именем mongodb:
   
   mv mongodb-macos-* ~/mongodb
   
   
------------------------------
## Шаг 2. Создайте папку для данных (Данный шаг критически важен)
В отличие от автоматической установки, при ручной распаковке вам нужно самому создать папку, куда MongoDB будет сохранять ваши базы данных.

mkdir -p ~/data/db

------------------------------
## Шаг 3. Запустите MongoDB
Теперь запустим сервер базы данных вручную, указав ему путь к только что созданной папке для данных:

~/mongodb/bin/mongod --dbpath ~/data/db

Важно: После ввода этой команды терминал «зависнет» и начнет выводить логи. Это нормально! Значит, сервер базы данных запустился и работает в фоновом режиме. Не закрывайте это окно терминала, иначе база данных отключится.

------------------------------
## Шаг 4. Проверка работы (в новом окне)
Чтобы проверить, что база отвечает:

   1. Откройте новое (второе) окно Терминала (нажмите Cmd + N или Cmd + T).
   2. Запустите консоль управления (клиент), которая лежит в той же папке:
   
   ~/mongodb/bin/mongosh
   
   
Если в строке появилось приглашение test>, поздравляю — вы успешно установили и запустили MongoDB вручную!
Получилось запустить команду mongod без ошибок, или macOS заблокировала запуск с предупреждением о «ненадежном разработчике» (Unidentified Developer)? Если заблокировала, я подскажу, как дать разрешение в настройках Мака.

# а как настроить логин/пароль для подключения из приложений?

Для того чтобы защитить вашу базу данных и подключаться к ней из кода Node.js, Python, Java или C#, вам нужно сделать две вещи: включить авторизацию в настройках MongoDB и создать пользователя с логином и паролем.
Поскольку вы установили базу вручную из .tgz архива, вот пошаговый процесс настройки:
## Шаг 1. Создание пользователя (Администратора)

   1. Убедитесь, что ваш сервер MongoDB сейчас запущен (команда mongod).
   2. Откройте второе окно терминала и зайдите в оболочку управления:
   
   ~/mongodb/bin/mongosh
   
   3. Выберите системную базу данных admin:
   
   use admin
   
   4. Создайте пользователя (вместо myUser и myPassword впишите свои данные):
   
   db.createUser({
     user: "myUser",
     pwd: "myPassword",
     roles: [ { role: "userAdminAnyDatabase", db: "admin" }, "readWriteAnyDatabase" ]
   })
   
   Вы увидите подтверждение { ok: 1 }. Это значит, что пользователь успешно создан.
   5. Выйдите из оболочки: exit.

------------------------------
## Шаг 2. Перезапуск MongoDB с включенной защитой
Теперь нужно остановить сервер, который работает без паролей, и запустить его заново, но уже в защищенном режиме.

   1. Перейдите в то окно терминала, где у вас запущен сервер mongod, и нажмите Ctrl + C для его остановки.
   2. Запустите сервер заново, добавив в конец флаг --auth:
   
   ~/mongodb/bin/mongod --dbpath ~/data/db --auth
   
   Теперь никто не сможет прочитать или записать данные в базу без ввода логина и пароля.

------------------------------
## Шаг 3. Строка подключения (Connection String) для приложений
Чтобы ваше приложение (бэкенд) могло подключиться к этой базе, вам нужно передать ему специальный адрес (URL). В современных фреймворках и библиотеках (например, в Mongoose для Node.js) он выглядит так:

mongodb://myUser:myPassword@localhost:27017/имя_вашей_базы?authSource=admin

Разбор строки по частям:

* myUser:myPassword — ваши созданные логин и пароль.
* localhost:27017 — стандартный адрес локального сервера MongoDB.
* /имя_вашей_базы — имя базы данных вашего приложения (MongoDB создаст её автоматически при первой записи).
* ?authSource=admin — важный параметр, который указывает базе данных, что логин и пароль нужно проверять в системной таблице admin, которую мы настроили на Шаге 1.

На каком языке программирования или фреймворке написано ваше приложение? Если хотите, я могу показать готовый пример кода для подключения к MongoDB с созданным логином и паролем.

# Mongosh

Всё в порядке, вы не ошиблись! Начиная с версии MongoDB 6.0+, компания MongoDB [убрала встроенную консоль (интерфейс) из основного серверного архива .tgz](https://www.mongodb.com/docs/v8.0/tutorial/install-mongodb-on-ubuntu-tarball/). Теперь сервер (mongod) и оболочка (mongosh) — это две разные программы, которые скачиваются отдельно. [1, 2] 
Чтобы у вас появилась команда mongosh для настройки логина и пароля, выполните следующие простые шаги:
## Шаг 1. Скачайте Mongo Shell отдельно

   1. Перейдите на официальный сайт на страницу [MongoDB Shell Download](https://www.mongodb.com/try/download/shell).
   2. Выберите вашу версию macOS, а в поле Package обязательно выберите tgz.
   3. Нажмите Download. [3, 4, 5] 

## Шаг 2. Распакуйте и объедините папки
У вас скачается новый архив с именем вроде mongosh-X.X.X-darwin-...tgz. Давайте распакуем его и положим исполняемый файл к остальным: [5] 

   1. Откройте Терминал и перейдите в Загрузки:
   
   cd ~/Downloads
   
   2. Распакуйте скачанный шелл:
   
   tar -zxvf mongosh-*.tgz
   
   3. Перенесите файл mongosh прямо в вашу созданную папку ~/mongodb/bin, где уже лежат mongod и mongos:
   
   cp mongosh-*/bin/mongosh ~/mongodb/bin/
   
   [5, 6] 

## Шаг 3. Проверьте результат
Теперь проверьте содержимое папки bin. Там должен появиться четвертый файл.
Запустите проверку версии:

~/mongodb/bin/mongosh --version

После этого вы сможете открыть новое окно терминала и выполнить Шаг 1 из предыдущего ответа (~/mongodb/bin/mongosh), чтобы зайти в базу и настроить пользователей, логины и пароли. [6] 
Успешно ли перенесся файл mongosh, и получилось ли теперь запустить оболочку для создания администратора базы данных?
